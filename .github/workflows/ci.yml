# Lints every guide on pull requests and pushes; on main, keeps index.json and the README table up to date.
#
# Uses `npx teamtrail@next guides lint`, which works once the next Teamtrail release (with guides) is published.
# The index is built by scripts/build-guide-catalog.mjs from the Teamtrail repo, with history and "Verified" from
# git (Reviewed-by: trailers), so it needs the full history and runs after merge: a guide's own merge commit has to
# exist before the index can name it. The bot commit only touches index.json, index.html and README.md, never a
# guide, so rebuilding after it gives the same index.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint every guide (schema, safety lint, a test example per guide)
        run: npx --yes teamtrail@next guides lint .

  index:
    if: github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: teamtrailhq/teamtrail
          path: .teamtrail-tools
          sparse-checkout: scripts/build-guide-catalog.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global teamtrail@next
      - name: Check index.json is up to date, and rebuild it when it isn't
        run: |
          build() { node .teamtrail-tools/scripts/build-guide-catalog.mjs . --out . \
            --repo "https://github.com/${{ github.repository }}" --cli "$(npm root -g)/teamtrail/dist/cli.js" "$@"; }
          if build --check; then exit 0; fi
          build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json index.html README.md
          git commit -m "Update index.json"
          git push
          build --check
